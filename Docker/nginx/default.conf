# ================================================================
# nginx リバースプロキシ設定
#   - port 80 で受信
#   - /static/, /media/ は nginx が直接配信
#   - それ以外は django (api:8000) にプロキシ
#   - Slow Client バッファリング、gzip 圧縮
# ================================================================
# ALB が付与する X-Forwarded-Proto をそのままDjangoへ渡す
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme; # ヘッダが無ければ nginx 自身のスキーム (ALBなしローカル用)
    http http;
    https https;
}

# Upstream（Gunicornへの接続設定）
upstream django {
    # docker-compose.ymlのサービス名:ポート
    server api:8000;
    
    # 接続プーリング設定
    keepalive 32;
}

# gzip 圧縮 (レスポンス転送量削減)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;
gzip_min_length 1000;

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;

    # --- ログ (docker awslogs driver 経由で CloudWatch Logs へ) ---
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # --- リクエスト制限 ---
    # クライアントリクエストの最大サイズ
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # --- タイムアウト ---(nginx - ブラウザ間の通信)
    # 遅いクライアント対策 (slowloris 対策)
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # プロキシタイムアウト(nginx - django間の通信)
    # ※ gunicorn.conf.py の timeout=60 と揃える
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # --- セキュリティヘッダ ---(全レスポンスに適用)
    # 同一オリジンからのみ iframe 埋め込み許可 (Clickjacking 対策)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Content-Type Sniffing 抑制 (MIME 誤判定攻撃対策)
    add_header X-Content-Type-Options "nosniff" always;
    # 旧ブラウザ向け XSS フィルタ
    add_header X-XSS-Protection "1; mode=block" always;
    # HTTPS 強制 (ALB が HTTPS 終端 → クライアントには HTTPS で応答)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- nginx へのヘルスチェック応答設定 ---
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ============================================================
    # Django ヘルスチェック
    # ============================================================
    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- Django へのプロキシ (メイン処理) ---
    location /api/ {
        # バッファリング有効
        # クライアントからの受信を完了してから gunicorn に渡す
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;

    # プロキシヘッダ設定
    # 元のアクセス先のホスト名をDjangoへ渡す
    proxy_set_header Host $host;
    # ユーザーのIPアドレス
    proxy_set_header X-Real-IP $remote_addr;
    # リクエストが通ってきたIP一覧
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 元の通信がHTTPなのかHTTPSなのか表示（リダイレクト処理など判断する）
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # ユーザーがリクエスト時に使用したポート番号をバックエンドに伝える
    proxy_set_header X-Forwarded-Port $server_port;
    # ユーザーがリクエスト時に使用したホスト名（ドメイン名）をバックエンドに伝える
    proxy_set_header X-Forwarded-Host $host;

    # HTTP/1.1 keepalive を有効化
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Djangoから返されるリダイレクトを書き換えない(Django に任せる)
    proxy_redirect off;

    # Nginxが接続先のサーバーでエラーが起きた場合に、別のサーバーへ自動的にリクエストを送り直す
    # サーバーを複数設定の場合に有効
    proxy_next_upstream error timeout invalid_header http_502 http_503;
    proxy_next_upstream_tries 2;

    # プロキシ先
    proxy_pass http://django;
    }

    # ============================================================
    # Django Admin
    # ============================================================
    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://django;
    }

    # --- Django 静的ファイル (Admin 用) ---
    # Django collectstatic の出力先
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Django へのプロキシ (メイン処理) ---
    location / {
        # バッファリング有効
        # クライアントからの受信を完了してから gunicorn に渡す
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;

    # プロキシヘッダ設定
    # 元のアクセス先のホスト名をDjangoへ渡す
    proxy_set_header Host $host;
    # ユーザーのIPアドレス
    proxy_set_header X-Real-IP $remote_addr;
    # リクエストが通ってきたIP一覧
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 元の通信がHTTPなのかHTTPSなのか表示（リダイレクト処理など判断する）
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # ユーザーがリクエスト時に使用したポート番号をバックエンドに伝える
    proxy_set_header X-Forwarded-Port $server_port;
    # ユーザーがリクエスト時に使用したホスト名（ドメイン名）をバックエンドに伝える
    proxy_set_header X-Forwarded-Host $host;

    # HTTP/1.1 keepalive を有効化
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Djangoから返されるリダイレクトを書き換えない(Django に任せる)
    proxy_redirect off;

    # Nginxが接続先のサーバーでエラーが起きた場合に、別のサーバーへ自動的にリクエストを送り直す
    # サーバーを複数設定の場合に有効
    proxy_next_upstream error timeout invalid_header http_502 http_503;
    proxy_next_upstream_tries 2;

    # プロキシ先
    proxy_pass http://django;
    }

    # --- favicon 404 ノイズ抑制 ---
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # --- 隠しファイルアクセス拒否 ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
}
