# ================================================================
# docker-compose.prod.yml (本番 EC2 で稼働)
# ================================================================

services:
  # ------------------------------------------------------------
  # nginx: React SPA 配信 + リバースプロキシ + Django静的配信
  # ------------------------------------------------------------
  nginx:
    image: ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/keigo-nginx:latest
    container_name: keigo-nginx
    ports:
      - "80:80"
    volumes:
      # Django Admin 用の静的ファイルを read-only で参照
      - staticfiles:/app/staticfiles:ro
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M
    logging:
      driver: awslogs
      options:
        awslogs-group: /keigo/nginx
        awslogs-region: ${REGION}
        awslogs-stream: ${HOSTNAME}

  # ------------------------------------------------------------
  # api: Django + gunicorn
  # ------------------------------------------------------------
  api:
    image: ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/keigo-api:latest
    container_name: keigo-api
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
    networks:
      - app-network
    environment:
      AWS_REGION: ${REGION}
      ENV: production
      DJANGO_SETTINGS_MODULE: config.settings
      GUNICORN_WORKERS: "3"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1400M
    logging:
      driver: awslogs
      options:
        awslogs-group: /keigo/api
        awslogs-region: ${REGION}
        awslogs-stream: ${HOSTNAME}

networks:
  app-network:
    driver: bridge

volumes:
  staticfiles:
    driver: local
