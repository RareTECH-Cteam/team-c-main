<div class="conversion-result" data-conversion-result>
    <section class="conversion-result__card" aria-labelledby="before-text-title">
        <h2 id="before-text-title">
            変換前の文章
        </h2>

        <p class="conversion-result__text">
            {{ input_text }}
        </p>
    </section>

    <section class="conversion-result__card" aria-labelledby="after-text-title">
        <h2 id="after-text-title">
            変換後の文章
        </h2>

        <p id="converted-text" class="conversion-result__text" data-converted-text>
            {{ converted_text }}
        </p>

        <button type="button" class="conversion-result__copy" data-copy-button data-copy-target="converted-text">
            コピー
        </button>
    </section>

    <dl class="conversion-result__conditions" aria-label="変換条件">
        <div>
            <dt>変換タイプ</dt>
            <dd>{{ target_label }}</dd>
        </div>

        {% if scene_label %}
        <div>
            <dt>場面</dt>
            <dd>{{ scene_label }}</dd>
        </div>
        {% endif %}
    </dl>

    <!-- バックエンドの方とすり合わせで内容を決める -->
    {% if feedback_enabled %}
    <section class="conversion-result__card conversion-result__feedback" aria-labelledby="feedback-title">
        <h2 id="feedback-title">
            フィードバック
        </h2>

        <button type="button" class="conversion-result__secondary-button" data-feedback="more_formal">
            もっと固くしてください
        </button>

        <button type="button" class="conversion-result__secondary-button" data-feedback="softer">
            もっと柔らかくしてください
        </button>
    </section>
    {% endif %}

    {% if reason %}
    <button type="button" class="conversion-result__secondary-button" data-reason-toggle aria-expanded="false"
        aria-controls="conversion-reason">
        理由を表示
    </button>

    <section id="conversion-reason" class="conversion-result__reason" hidden>
        <h2>変換理由</h2>

        <!-- 受け渡し方の相談要 -->
        <p class="conversion-result__text">
            {{ reason }}
        </p>

        <button type="button" class="conversion-result__secondary-button" data-reason-close>
            理由を閉じる
        </button>
    </section>
    {% endif %}

    <button type="button" class="conversion-result__secondary-button" data-result-close>
        閉じる
    </button>

    <p class="conversion-result__status" data-copy-status role="status" aria-live="polite" hidden></p>
</div>
