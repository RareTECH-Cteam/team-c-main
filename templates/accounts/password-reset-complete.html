{% extends 'base.html' %}
{% load static %}

{% block title %}パスワード再設定完了 | コトバディ{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="login-page">
    <p class="login-page__title">
        コトバディ
    </p>

    <section class="login-card" aria-labelledby="password-reset-complete-title">
        <h1 id="password-reset-complete-title" class="login-card__title">パスワードを再設定しました</h1>

        <p class="login-card__description">
            新しいパスワードの設定が完了しました。新しいパスワードでログインしてください。
        </p>

        <a class="login-card__submit" href="{% url 'accounts:login' %}">
            ログインする
        </a>
    </section>
</div>
{% endblock %}
